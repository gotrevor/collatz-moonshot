name = "CollatzMoonshot"
defaultTargets = ["CollatzMoonshot", "MSP2"]

# Birth-time switch (cheapest at repo birth - flipping later forces a full rebuild):
# machine-authored binders must be declared, never hallucinated into existence.
# Dev-tier repo: warnings stay visible as in-flight signal (no warningAsError yet).
[leanOptions]
autoImplicit = false

# Mathlib is a direct, version-pinned dependency. Developers may optionally use a shared
# local cache; CI and a fresh clone need no machine-specific path.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "CollatzMoonshot"

# Lean formalization of Sousa Pereira & Mazzoni's MSP² framework (Zenodo 10.5281/zenodo.22555969).
# Its own library so it never shares a file with the moonshot proper; see MSP2/README.md.
[[lean_lib]]
name = "MSP2"

# Shared research-ledger checks (#maze_audit): Maze rows must cite declarations.
[[require]]
name = "LeanLedger"
git = "https://github.com/gotrevor/lean-agent-skills.git"
rev = "fec556e47718d69a6fa8796c5faab1eeba8974a5"
subDir = "lean"
